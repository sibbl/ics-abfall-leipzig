name: Auto-update Leipzig Streets Data

on:
  schedule:
    # Run every Sunday at 03:00 UTC
    - cron: '0 3 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Street Scraper
        run: python update_streets.py

      - name: Commit & Push Changes if updated
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add streets.json
          if git diff --staged --quiet; then
            echo "No changes in streets.json data."
          else
            git commit -m "chore: auto-update streets.json data"
            git push
          fi
